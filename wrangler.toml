name = "s-arc"
main = "worker.ts"
compatibility_date = "2024-09-23"
workers_dev = true

routes = [
  { pattern = "southernarchitecture.in", custom_domain = true },
  { pattern = "www.southernarchitecture.in", custom_domain = true }
]

[assets]
directory = "./web/out"
binding = "ASSETS"
run_worker_first = ["/", "/designs", "/designs/*", "/architects", "/architects/*", "/styles", "/styles/*", "/plot-intelligence", "/plot-intelligence/*", "/plot-my-land", "/plot-my-land/*", "/api/*", "/uploads/*", "/robots.txt", "/sitemap.xml"]
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

[[d1_databases]]
binding = "DB"
database_name = "s-arc-db"
database_id = "496764fb-0e0f-408d-b5c5-8e8f998526d6"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "s-arc-uploads"

[[send_email]]
name = "EMAIL"

[vars]
NEXT_PUBLIC_APP_URL = "https://southernarchitecture.in"
